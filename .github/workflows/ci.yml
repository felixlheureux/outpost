name: Starter checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make setup
      - name: Install pinned SQL generator
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
      - run: make generate
      - run: make check VERSION=${{ github.sha }}
      - name: Verify generated source is committed
        run: git diff --exit-code -- internal/store/dbgen web/src/routeTree.gen.ts
      - name: Install test browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - run: make smoke
