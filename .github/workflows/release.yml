name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make setup
      - name: Verify generated SQL source
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          make generate
          git diff --exit-code -- internal/store/dbgen web/src/routeTree.gen.ts
      - name: Build and check embedded application
        run: make check VERSION="$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
      - name: Install test browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - run: make smoke
      - name: Build Linux release assets and checksums
        run: make release VERSION="$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
      - name: Verify release checksums
        run: |
          cd dist
          sha256sum -c outpost-linux-amd64.sha256 outpost-linux-arm64.sha256 outpost-backup.py.sha256
      - name: Publish release
        run: |
          flags=()
          case "$RELEASE_VERSION" in *-rc*|*-beta*) flags+=(--prerelease) ;; esac
          gh release create "$RELEASE_VERSION" dist/outpost-linux-amd64 dist/outpost-linux-amd64.sha256 dist/outpost-linux-arm64 dist/outpost-linux-arm64.sha256 dist/outpost-backup.py dist/outpost-backup.py.sha256 --verify-tag --generate-notes "${flags[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
